[package]
name = "knave-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust/wgpu desktop shell for Knave"

[[bin]]
name = "knave-shell"
path = "src/main.rs"

[dependencies]
knave-portal-api = { git = "https://github.com/knave-de/knave.git", rev = "2adca33a0d537920fc338d0eb418f8581f0d8a76" }
serde_json = "1"
base64 = "0.22"
png = "0.18"
libc = "0.2"
knave-apps.workspace = true
knave-icons.workspace = true
knave-renderer.workspace = true
knave-wayland.workspace = true
knave-ui.workspace = true
knave-desktop-api.workspace = true
knave-config.workspace = true

[dev-dependencies]
png.workspace = true
tempfile = "3"
