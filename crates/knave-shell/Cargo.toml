[package]
name = "knave-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust/wgpu desktop shell for Knave"

[[bin]]
name = "knave-shell"
path = "src/main.rs"

[dependencies]
knave-portal-api = { git = "https://github.com/knave-de/knave.git", rev = "581750726e76245d85e3d3c7131f3c848802b27b" }
serde_json = "1"
base64 = "0.22"
png = "0.18"
libc = "0.2"
knave-apps.workspace = true
knave-icons.workspace = true
knave-renderer.workspace = true
knave-wayland.workspace = true
knave-ui.workspace = true
knave-desktop-api.workspace = true

[dev-dependencies]
png.workspace = true
