[workspace]
members = [
    "crates/knave-apps",
    "crates/knave-icons",
    "crates/knave-shell",
    "crates/knave-shell-ui",
    "crates/knave-wayland",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
knave-shell-ui = { path = "crates/knave-shell-ui" }
knave-apps = { path = "crates/knave-apps" }
knave-icons = { path = "crates/knave-icons" }
knave-renderer = { git = "https://github.com/knave-de/knave-ui.git", rev = "e6db89f959c3ac8fc85746fcd09074996a01becb" }
knave-wayland = { path = "crates/knave-wayland" }
knave-ui = { git = "https://github.com/knave-de/knave-ui.git", rev = "e6db89f959c3ac8fc85746fcd09074996a01becb" }
base64 = "0.22"
png = "0.18"
wgpu = "30.0.1"
knave-desktop-api = { git = "https://github.com/knave-de/knave.git", rev = "45f0a735a9ba1d3afb09650c7a5b13cf75f8b252" }
# Config schema required by this shell version, including `shell.pinned_apps`.
knave-config = { git = "https://github.com/knave-de/knave.git", rev = "7d1a145242ec94c0ad7cb01548698a7651d99a04" }
pollster = "1.0.1"
thiserror = "2.0.21"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = { version = "0.31.15", features = ["system"] }
